version: '3.8'

services:
  # 1. Orchestrator Service (The FastAPI App)
  orchestrator:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - LLM_BASE_URL=http://llm-service:11434
      - OLLAMA_HOST=http://llm-service:11434
      - EMBEDDING_API_URL=http://embedding-service:80/embed
      - EMBEDDING_STRATEGY=remote # Set to local if you want to run BGE inside this container
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - qdrant
      - embedding-service
      - llm-service

  # 2. Vector DB Service
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  # 3. Embedding Service (BGE)
  # Example using Hugging Face Text Embeddings Inference (TEI)
  embedding-service:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    ports:
      - "8081:80"
    command: --model-id BAAI/bge-small-en-v1.5
    restart: always

  # 4. LLM Service (Gemma)
  llm-service:
    image: ollama/ollama:latest
    env_file: .env
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/ollama-entrypoint.sh
    entrypoint: /bin/sh /ollama-entrypoint.sh
    restart: always

  # 5. Data Seeder (Automated local setup)
  seeder:
    build: .
    environment:
      - API_URL=http://orchestrator:8000
    depends_on:
      - orchestrator
    command: python scripts/seed_data.py

volumes:
  qdrant_storage:
  ollama_storage:
