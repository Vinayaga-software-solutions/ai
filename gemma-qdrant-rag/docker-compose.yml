services:
  # 0. Laravel Control Plane
  control-plane:
    build:
      context: ../control-plane
      dockerfile: Dockerfile
    env_file:
      - ../control-plane/.env
    ports:
      - "8080:8080"
    restart: always

  # 1. Orchestrator Service (The FastAPI App)
  orchestrator:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - LLM_BASE_URL=http://llm-service:11434
      - OLLAMA_HOST=http://llm-service:11434
      - EMBEDDING_API_URL=http://embedding-service:80/embed
      - EMBEDDING_STRATEGY=remote # Set to local if you want to run BGE inside this container
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - qdrant
      - embedding-service
      - llm-service

  # 2. Vector DB Service
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  # 3. Embedding Service (BGE)
  # Local Embedding Service (can proxy to a remote TEI instance via EMBEDDING_REMOTE_URL)
  embedding-service:
    build: ./services/embedding
    ports:
      - "8081:80"
    env_file: .env.services
    environment:
      - EMBEDDING_STRATEGY=local
    restart: always

  # 4. LLM Service (Gemma)
  llm-service:
    image: ollama/ollama:latest
    env_file: .env
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/ollama-entrypoint.sh
    entrypoint: /bin/sh /ollama-entrypoint.sh
    restart: always

  # 5. Data Seeder (Automated local setup)
  seeder:
    build: .
    environment:
      - API_URL=http://orchestrator:8000
    depends_on:
      - orchestrator
    volumes:
      - seeder_state:/state
    command: python scripts/seed_data.py

  # 6. Ingestion Service (skeleton)
  ingestion:
    build: ./services/ingestion
    ports:
      - "8010:80"
    env_file: .env.services
    restart: always
    depends_on:
      - qdrant

  # 7. Chunking Service (skeleton)
  chunking:
    build: ./services/chunking
    ports:
      - "8011:80"
    env_file: .env.services
    restart: always
    depends_on:
      - ingestion

  # 8. Retrieval Service (skeleton)
  retrieval:
    build: ./services/retrieval
    ports:
      - "8012:80"
    env_file: .env.services
    restart: always
    depends_on:
      - qdrant
      - embedding-service

  # 9. Auth Service (skeleton)
  auth:
    build: ./services/auth
    ports:
      - "8013:80"
    env_file: .env.services
    restart: always

  # 10. Gateway (skeleton)
  gateway:
    build: ./services/gateway
    ports:
      - "8005:80"
    env_file: .env.services
    restart: always
    depends_on:
      - orchestrator
      - auth
      - retrieval

  # 11. Smoke Test (one-shot)
  smoke:
    image: python:3.11-slim
    volumes:
      - ./scripts:/scripts:ro
      - seeder_state:/state
    env_file: .env.services
    depends_on:
      - orchestrator
      - qdrant
      - embedding-service
      - llm-service
      - ingestion
      - chunking
      - retrieval
      - auth
      - gateway
      - seeder
    entrypoint: /bin/sh -c "pip install --no-cache-dir requests && python /scripts/smoke_test.py"
    restart: 'no'

volumes:
  qdrant_storage:
  ollama_storage:
  seeder_state:
